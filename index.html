<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red–Blue Policy Game</title>
<style>
/* Layout: one stimulus "screen" at a time, centred on a white card like a Qualtrics page; a control strip above it. */
:root {
  --page: #EEF1F6;      /* surround, outside the stimulus */
  --card: #FFFFFF;      /* the stimulus itself */
  --ink: #1B2333;
  --sub: #5A6478;
  --gray: #8A94A6;
  --line: #D3DAE6;
  --tile: #F4F6FB;
  --red: #C8372D;
  --red-soft: #FBE9E7;
  --blue: #2E6FDB;
  --blue-soft: #E3ECFB;
  --win: #1E7F4F;
  --font: "Inter", Arial, Helvetica, sans-serif;
  --display: "Space Grotesk", "Inter", Arial, sans-serif;
  color-scheme: light;
}
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 13px; color: var(--sub); }
.controls .lbl { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 6px 12px; font: inherit; color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"].r { background: var(--red); color: #fff; }
.seg button[aria-pressed="true"].b { background: var(--blue); color: #fff; }
.screens { display: flex; flex-wrap: wrap; gap: 6px; }
.screens button { border: 1px solid var(--line); background: var(--card); color: var(--sub); border-radius: 999px;
  padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.screens button[aria-current="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding-block: 36px 32px;
  padding-inline: clamp(16px, 4vw, 48px); display: flex; flex-direction: column; align-items: center; gap: 22px; min-height: 480px; }
h1 { font-family: var(--display); font-size: clamp(26px, 4vw, 36px); margin: 0; text-align: center; text-wrap: balance; }
.step { color: var(--sub); font-size: 14px; margin-top: -14px; }
.lead { font-size: 17px; text-align: center; max-width: 60ch; line-height: 1.5; margin: 0; }
.lead b.r { color: var(--red); } .lead b.b { color: var(--blue); }

/* team badge */
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 56px; border-radius: 10px; border: 3px solid; }
.badge.r { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.badge.b { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.badge .big { font-family: var(--display); font-size: 44px; font-weight: 700; }

/* six players */
.players { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 720px; }
.pl { border: 2px solid; border-radius: 8px; padding: 12px 4px; text-align: center; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.pl.r { border-color: var(--red); background: var(--red-soft); }
.pl.b { border-color: var(--blue); background: var(--blue-soft); }
.pl .t { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.pl.r .t { color: var(--red); } .pl.b .t { color: var(--blue); }
.pl .you { font-weight: 700; }
.pl .pick { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; margin-top: 4px; color: var(--ink); }

/* letter tiles */
.letters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 820px; }
.lt { border: 2px solid var(--gray); border-radius: 8px; background: var(--card); padding: 12px 6px; display: flex; flex-direction: column;
  align-items: center; gap: 6px; font: inherit; color: var(--ink); }
.lt .ch { font-family: var(--display); font-size: 40px; font-weight: 700; color: var(--gray); line-height: 1; }
.lt .pts { font-size: 12.5px; color: var(--sub); display: flex; flex-direction: column; gap: 2px; align-items: center; }
.lt.pol { border-color: var(--ink); }
.lt.pol .ch { color: var(--ink); }
.lt .pts .r { color: var(--red); font-weight: 600; } .lt .pts .b { color: var(--blue); font-weight: 600; }
.lt .pts .mine { text-decoration: underline; text-underline-offset: 3px; }
button.lt { cursor: pointer; }
button.lt:hover { background: var(--tile); }
button.lt[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; background: var(--tile); }

/* payoff table */
.tbl-wrap { overflow-x: auto; width: 100%; max-width: 640px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
th, td { padding: 10px 14px; text-align: center; border-bottom: 1px solid var(--line); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--sub); font-weight: 600; }
td.letter { font-family: var(--display); font-size: 24px; font-weight: 700; }
th.r, td.r { color: var(--red); } th.b, td.b { color: var(--blue); }
td.z { color: var(--gray); }

/* history grid */
.hist { overflow-x: auto; width: 100%; max-width: 760px; }
.hist table td, .hist table th { border: 0; padding: 4px; }
.hist .who { text-align: right; white-space: nowrap; font-size: 14px; padding-right: 10px; }
.hist .who .tag { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.hist .who .tag.r { background: var(--red); } .hist .who .tag.b { background: var(--blue); }
.cell { border: 1.5px solid var(--line); background: var(--tile); border-radius: 6px; height: 44px; min-width: 64px;
  display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 22px; font-weight: 700; }
.cell.empty { background: var(--card); border-style: dashed; color: var(--gray); font-size: 14px; font-weight: 400; }
.cell.now { border-color: var(--ink); }
.outcome { font-size: 13px; color: var(--sub); line-height: 1.35; }
.outcome .ok { color: var(--win); font-weight: 600; }
.note { font-size: 12px; color: var(--gray); text-align: center; }
.nav { display: flex; gap: 10px; justify-content: center; }
.nav button { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 6px; padding: 8px 18px; font: inherit; cursor: pointer; }
.nav button.ghost { background: var(--card); color: var(--ink); }
.nav button:disabled { opacity: .35; cursor: default; }

/* intro rules, numbered like the earlier Name Game intro slide */
.rules { list-style: none; counter-reset: r; margin: 0; padding: 0; max-width: 62ch; display: flex; flex-direction: column; gap: 12px; }
.rules li { counter-increment: r; position: relative; padding-left: 44px; font-size: 16px; line-height: 1.45; }
.rules li::before { content: counter(r); position: absolute; left: 0; top: -2px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.rules-h { margin: 4px 0 -8px; font-weight: 600; color: var(--sub); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { width: 44px; height: 46px; border: 1.8px solid var(--gray); border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--gray); }
td.theory { font-size: 13px; text-align: left; color: var(--ink); background: #FFF8E1; }
th.researcher { background: #FFF8E1; }
.thsub { font-size: 10.5px; font-weight: 400; text-transform: none; letter-spacing: 0; }
/* participant preview: hide everything a participant would not see */
.pv-btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
.exit { display: none; position: fixed; top: 8px; right: 8px; z-index: 5; font-size: 11px; color: var(--gray); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; opacity: .6; }
.exit:hover { opacity: 1; }
body.pview .controls, body.pview .spec, body.pview .researcher { display: none; }
body.pview .exit { display: block; }
.spec { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; font-size: 13.5px; line-height: 1.55; }
.spec h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); margin: 0 0 6px; }
.spec ul { margin: 0; padding-left: 18px; }

@media (max-width: 640px) {
  .letters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .players { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .badge { padding: 20px 28px; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: opacity .15s; } }
body.pview .exit { display: none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
</head>
<body class="pview">
<div class="wrap">
  <div class="controls">
    <span class="lbl">Participant is on</span>
    <div class="seg" role="group" aria-label="Participant team">
      <button id="teamR" class="r" aria-pressed="true">Red team</button>
      <button id="teamB" class="b" aria-pressed="false">Blue team</button>
    </div>
    <span class="lbl">Screen</span>
    <div class="screens" id="screens"></div>
    <button class="pv-btn" id="pv">Preview as participant</button>
  </div>
  <button class="exit" id="exit">Exit preview</button>

  <main class="card" id="card" aria-live="polite"></main>

  <div class="nav">
    <button class="ghost" id="back">Back</button>
    <button id="next">Next</button>
  </div>

</div>

<script>
const LETTERS = ["P", "Q", "R", "S", "J", "M", "N", "T", "X", "Y"];
const PAY = { P: { r: 7.5, b: 15 }, R: { r: 17, b: 3 }, S: { r: 12, b: 10 } };
const THEORY = null;
// Where each letter (and so each policy) appears on screen is shuffled once per participant, then kept fixed
// for the whole game (kept across reloads in the same tab). Reproduce an order with ?order=<number>.
const ORDER_SEED = (() => {
  let s = new URLSearchParams(location.search).get("order");
  try { s = s || sessionStorage.getItem("rb_order"); } catch (e) {}
  if (!s || !/^\d+$/.test(s)) s = String(1 + Math.floor(Math.random() * 1e9));
  try { sessionStorage.setItem("rb_order", s); } catch (e) {}
  return s;
})();
const ORDER = (() => {
  let x = (Number(ORDER_SEED) >>> 0) || 1;
  const rnd = () => (x = (Math.imul(x, 1664525) + 1013904223) >>> 0) / 4294967296;
  const a = LETTERS.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
})();
const PAYING = ORDER.filter(ch => PAY[ch]);
const ZERO = ORDER.filter(ch => !PAY[ch]);
// Participants see TEAM totals (per-player amount × team size), split equally among that team's players.
const NTEAM = { r: 4, b: 2 };
const teamPts = (ch, t) => (PAY[ch] ? NTEAM[t] * PAY[ch][t] : 0);
const TEAMS = ["r", "r", "r", "r", "b", "b"];          // Players 1-4 Red, 5-6 Blue
const TEAMNAME = { r: "Red", b: "Blue" };
// Example choices of the five other players, per round (index = player 0..5; the participant's slot is filled from their pick)
const EXAMPLE = [
  ["P", "P", "P", "Q", "Q", "Q"],
  ["P", "P", "P", "P", "Q", "Q"],
  ["P", "P", "P", "P", "P", "Q"],
  ["P", "P", "P", "P", "P", "P"],
  ["P", "P", "P", "P", "P", "P"],
  ["P", "P", "P", "P", "P", "P"],
];
const ROUNDS = EXAMPLE.length;

// Team comes from the link: index.html?team=red or ?team=blue. Without it, Red or Blue is assigned at random (4:2, matching team sizes).
const _q = new URLSearchParams(location.search).get("team");
let team = _q === "blue" || _q === "b" ? "b" : _q === "red" || _q === "r" ? "r" : (Math.random() < 4/6 ? "r" : "b");
let screen = 0;
let picks = Array(ROUNDS).fill(null);

const youIdx = () => (team === "r" ? 0 : 4);

function screensList() {
  const s = [
    { id: "intro", label: "How it works" },
    { id: "team", label: "Team" },
    { id: "players", label: "Players" },
    { id: "values", label: "Letter values" },
  ];
  for (let r = 0; r < ROUNDS; r++) {
    s.push({ id: "choose", round: r, label: `Round ${r + 1}: choose` });
    s.push({ id: "result", round: r, label: `Round ${r + 1}: result` });
  }
  s.push({ id: "end", label: "End" });
  return s;
}
const SCREENS = screensList();

function pts(ch, t) { return PAY[ch] ? PAY[ch][t] : 0; }

function tile(ch, opts = {}) {
  const pol = !!PAY[ch];
  const tag = opts.button ? "button" : "div";
  const pressed = opts.button ? ` aria-pressed="${opts.selected ? "true" : "false"}" data-ch="${ch}"` : "";
  const ptsHtml = pol
    ? `<span class="r ${team === "r" ? "mine" : ""}">Red Team ${teamPts(ch, "r")}</span><span class="b ${team === "b" ? "mine" : ""}">Blue Team ${teamPts(ch, "b")}</span>`
    : `<span>0 points</span>`;
  return `<${tag} class="lt ${pol ? "pol" : ""}"${pressed}><span class="ch">${ch}</span><span class="pts">${ptsHtml}</span></${tag}>`;
}

function players(choices) {
  return `<div class="players">${TEAMS.map((t, i) => `
    <div class="pl ${t}"><span class="t">${TEAMNAME[t]}</span><span>Player ${i + 1}</span>
    ${i === youIdx() ? '<span class="you">You</span>' : "<span>&nbsp;</span>"}
    ${choices ? `<span class="pick">${choices[i]}</span>` : ""}</div>`).join("")}</div>`;
}

function roundChoices(r) {
  const row = EXAMPLE[r].slice();
  row[youIdx()] = picks[r] || row[youIdx()];
  return row;
}

function outcomeFor(r) {
  const row = roundChoices(r);
  const all = row.every(c => c === row[0]);
  if (!all) return `<span>No match</span><br>0 points`;
  const ch = row[0];
  if (!PAY[ch]) return `<span class="ok">All matched ${ch}</span><br>0 points`;
  return `<span class="ok">All matched ${ch}</span><br>Red Team ${teamPts(ch, "r")} · Blue Team ${teamPts(ch, "b")}`;
}

function history(upto, highlight) {
  let h = `<div class="hist"><table><thead><tr><th></th>`;
  for (let r = 0; r < ROUNDS; r++) h += `<th>Round ${r + 1}</th>`;
  h += `</tr></thead><tbody>`;
  TEAMS.forEach((t, i) => {
    h += `<tr><td class="who"><span class="tag ${t}"></span>Player ${i + 1}${i === youIdx() ? " (You)" : ""}</td>`;
    for (let r = 0; r < ROUNDS; r++) {
      if (r <= upto) h += `<td><div class="cell ${r === highlight ? "now" : ""}">${roundChoices(r)[i]}</div></td>`;
      else h += `<td><div class="cell empty">–</div></td>`;
    }
    h += `</tr>`;
  });
  h += `<tr><td class="who">Result</td>`;
  for (let r = 0; r < ROUNDS; r++) h += `<td class="outcome">${r <= upto ? outcomeFor(r) : ""}</td>`;
  h += `</tr></tbody></table></div>`;
  return h;
}

function myTotal(upto) {
  let s = 0;
  for (let r = 0; r <= upto; r++) {
    const row = roundChoices(r);
    if (row.every(c => c === row[0])) s += pts(row[0], team);
  }
  return s;
}

function render() {
  const s = SCREENS[screen];
  const T = TEAMNAME[team];
  const card = document.getElementById("card");
  let html = "";
  if (s.id === "intro") {
    html = `<h1>How the Game Works</h1>
      <p class="lead">You are playing a coordination game with 5 other players (6 players total, including you). The game lasts <b>${ROUNDS} rounds</b>.</p>
      <ol class="rules">
        <li>There is no communication between players.</li>
        <li>Each round, all 6 players choose one letter at the same time.</li>
        <li>All 6 players must choose the <b>same</b> letter to earn points. If even one player chooses differently, everyone gets 0 points for that round.</li>
        <li>After each round, you will see whether all 6 players matched, the letter each player chose, the points earned that round, and your total points.</li>
      </ol>
      <p class="rules-h">The letters you can choose:</p>
      <div class="chips">${ORDER.map(ch => `<span class="chip">${ch}</span>`).join("")}</div>`;
  } else if (s.id === "team") {
    html = `<h1>Your Team</h1>
      <div class="badge ${team}"><span>You are on the</span><span class="big">${T} Team</span></div>`;
  } else if (s.id === "players") {
    html = `<h1>The Players</h1>
      <p class="lead">There are <b class="r">4 Red</b> players and <b class="b">2 Blue</b> players.</p>
      ${players()}`;
  } else if (s.id === "values") {
    html = `<h1>What Each Letter Is Worth</h1>
      <p class="lead">Each letter stands for a <b>different way of dividing points</b> between the Red Team and the Blue Team. If all six players pick the same letter, each team gets the points that letter says.</p>
      <p class="lead">Each team's points are <b>split equally among its players</b>: the Red Team's points are shared by its 4 players, and the Blue Team's points by its 2 players.</p>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Letter</th><th class="r">Red Team gets<br><span class="thsub">split among 4 players</span></th><th class="b">Blue Team gets<br><span class="thsub">split among 2 players</span></th>${THEORY ? '<th class="researcher">Theory (researcher only)</th>' : ""}</tr></thead>
        <tbody>
          ${PAYING.map(ch => `<tr><td class="letter">${ch}</td><td class="r">${teamPts(ch, "r")} points</td><td class="b">${teamPts(ch, "b")} points</td>${THEORY ? `<td class="researcher theory">${THEORY[ch]}</td>` : ""}</tr>`).join("")}
          <tr><td class="letter z">${ZERO.join(" ")}</td><td class="z">0 points</td><td class="z">0 points</td>${THEORY ? '<td class="researcher theory z">none (0 for all)</td>' : ""}</tr>
        </tbody></table></div>
      <p class="lead">You are on the <b class="${team}">${T} Team</b>.</p>`;
  } else if (s.id === "choose") {
    const r = s.round;
    html = `<h1>Round ${r + 1} of ${ROUNDS}</h1>
      <p class="lead">Pick a letter. Each letter is a different division of points between the teams, and it is paid only if all six players pick it. Each team's points are split equally among its players.<br>
      You are <b class="${team}">Player ${youIdx() + 1}, ${T} Team</b>.</p>
      ${players()}
      ${r > 0 ? history(r - 1, -1) : ""}
      <div class="letters" id="letters">${ORDER.map(ch => tile(ch, { button: true, selected: picks[r] === ch })).join("")}</div>
      <p class="note">${picks[r] ? `You picked ${picks[r]}. Press Next to submit.` : "Click a letter to choose it."}</p>`;
  } else if (s.id === "result") {
    const r = s.round;
    html = `<h1>Round ${r + 1} Results</h1>
      <p class="lead">What each player chose. Your share so far: <b>${myTotal(r)} points</b>.</p>
      ${players(roundChoices(r))}
      ${history(r, r)}
      <p class="note researcher">Other players' choices are example data for this mockup.</p>`;
  } else if (s.id === "end") {
    html = `<h1>Game Over</h1>
      <p class="lead">Your share: <b>${myTotal(ROUNDS - 1)} points</b> as a member of the <b class="${team}">${T} Team</b>.</p>
      ${history(ROUNDS - 1, -1)}`;
  }
  card.innerHTML = html;

  document.querySelectorAll("#letters .lt").forEach(b => b.addEventListener("click", () => {
    picks[s.round] = b.dataset.ch; render();
  }));
  document.getElementById("screens").innerHTML = SCREENS.map((x, i) =>
    `<button data-i="${i}" aria-current="${i === screen}">${x.label}</button>`).join("");
  document.querySelectorAll("#screens button").forEach(b => b.addEventListener("click", () => { screen = +b.dataset.i; render(); }));
  document.getElementById("back").disabled = screen === 0;
  const pview = document.body.classList.contains("pview");
  document.getElementById("next").disabled = screen === SCREENS.length - 1 || (pview && s.id === "choose" && !picks[s.round]);
  document.getElementById("next").textContent = pview && s.id === "choose" ? "Submit" : "Next";
}

const _oi = document.getElementById("orderinfo");
if (_oi) _oi.textContent = ORDER.join(" ") + " (seed " + ORDER_SEED + ")";

function setPreview(on) {
  document.body.classList.toggle("pview", on);
  screen = 0; picks = Array(ROUNDS).fill(null);
  render(); window.scrollTo(0, 0);
}
document.getElementById("pv").onclick = () => setPreview(true);
document.getElementById("exit").onclick = () => setPreview(false);

function setTeam(t) {
  team = t;
  document.getElementById("teamR").setAttribute("aria-pressed", t === "r");
  document.getElementById("teamB").setAttribute("aria-pressed", t === "b");
  render();
}
document.getElementById("teamR").onclick = () => setTeam("r");
document.getElementById("teamB").onclick = () => setTeam("b");
document.getElementById("back").onclick = () => { if (screen > 0) { screen--; render(); } };
document.getElementById("next").onclick = () => { if (screen < SCREENS.length - 1) { screen++; render(); } };
render();
</script>
</body>
</html>
